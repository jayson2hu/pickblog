name: L3 CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/l3_preflight.py
      - run: python scripts/l3_migration_smoke.py
      - run: python scripts/l3_smoke.py
      - run: python scripts/l3_clean.py

  reader-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/reader-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/reader-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: python ../../scripts/l3_clean.py
